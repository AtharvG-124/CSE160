<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WebGL Shape Painter</title>
    <script>
        // Fix for Node-flavored library errors
        var global = window;
        var module = {}; 
    </script>
</head>
<body onload="main()">
    <canvas id="webgl" width="400" height="400">
        Please use a browser that supports "canvas"
    </canvas>

    <div>
        <button type="button" id="pointButton">Point</button>
        <button type="button" id="triButton">Triangle</button>
        <button type="button" id="circleButton">Circle</button>
        <button type="button" id="clearButton">Clear</button>
    </div>

    <p>Size <input type="range" min="5" max="100" value="10" id="sizeSlide"></p>
    <p>Red <input type="range" min="0" max="100" value="100" id="redSlide"></p>
    <p>Green <input type="range" min="0" max="100" value="0" id="greenSlide"></p>
    <p>Blue <input type="range" min="0" max="100" value="0" id="blueSlide"></p>
    <p>Segments <input type="range" min="3" max="50" value="10" id="segmentSlide"></p>

    <script src="lib/cuon-matrix-cse160.js"></script>
    
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>

    <script src="Point.js"></script>
    <script src="Triangle.js"></script>
    <script src="Circle.js"></script> 
    
    <script src="ColoredPoints.js"></script>

    <section id="reference-image">
    <h3>Reference Drawing</h3>
    <img src="lib/IMG_5120.JPG" id="refImage" width="400" alt="My Graph Paper Drawing">
    <img src="lib/Screenshot 2026-04-13 at 4.12.49 PM.png" width="400" alt="">
    <p><i>Replicating this drawing using WebGL triangles.</i></p>
</section>
</body>
</html>
